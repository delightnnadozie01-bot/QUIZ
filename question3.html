<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Web Dev Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="quiz.css" rel="stylesheet">
    <style>
        body {
            background-color: #848688;
            padding-top: 50px;
        }
        .quiz-card {
            max-width: 500px;
            margin: auto;
            border-radius: 12px;
        }
    </style>
</head>
<body data-question-id="q3">
    <div class="container">
        <div class="card quiz-card shadow p-4">
            <h3 class="text-center mb-4">Quick Web Dev Quiz</h3>
            <p id="score-display" class="text-center fw-bold" aria-live="polite"></p>
            <div id="quiz-box">
                <p class="text-muted">Question 3/3</p>
                <h5 id="question-text" class="mb-4">What is the capital of France?</h5>
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary" type="button" data-answer="0">Paris</button>
                    <button class="btn btn-outline-primary" type="button" data-answer="1">Berlin</button>
                    <button class="btn btn-outline-primary" type="button" data-answer="2">Italy</button>
                </div>
            </div>
            <a href="question2.html" class="btn btn-secondary mt-4">Back</a>
            <button type="button" class="btn btn-primary mt-2" id="finish-btn" disabled>Finish Quiz</button>
            <div id="result-box" hidden>
                <h4>Quiz complete!</h4>
                <p>Your final score: <strong id="final-score"></strong></p>
                <a href="index.html" class="btn btn-primary">Choose another quiz</a>
            </div>
        </div>
    </div>
    <script src="quiz.js"></script>
</body>
</html>
